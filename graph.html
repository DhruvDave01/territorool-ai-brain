<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI_BRAIN graph</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #1a1a1a; color: #ececec; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    .shell { display: grid; grid-template-columns: minmax(0,1fr) 280px; height: 100%; }
    .shell.chat-open { grid-template-columns: minmax(300px, 400px) minmax(0,1fr) 280px; }
    .stage { position: relative; background: #1a1a1a; min-height: 0; overflow: hidden; }
    .title { display: none; }
    .hint {
      position: absolute; top: 14px; left: 0; right: 0; margin: 0;
      text-align: center; color: #8a8a8a; font-size: 11px; pointer-events: none; z-index: 2;
    }
    .zoom-hud {
      position: absolute; left: 12px; top: 12px; display: flex; flex-direction: column; gap: 6px; z-index: 2;
    }
    .zoom-hud button {
      width: 36px; height: 36px; margin: 0; padding: 0; border-radius: 8px;
      background: #2a2a2a; color: #ececec; border: 1px solid #444; font-size: 18px;
    }
    .zoom-hud #chat-toggle { width: auto; padding: 0 8px; font-size: 12px; }
    .chat-drawer {
      display: none; flex-direction: column; background: #1c1f3a;
      border-right: 1px solid #2a3154; min-height: 0;
    }
    .shell.chat-open .chat-drawer { display: flex; }
    .chat-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; border-bottom: 1px solid #2a3154; font-weight: 500;
    }
    .chat-head button { width: auto; margin: 0; padding: 4px 10px; background: #2a3154; color: #e8eaf4; }
    .chat-status { padding: 8px 14px; color: #8b93b5; font-size: 11px; }
    .chat-log { flex: 1; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .chat-bubble { padding: 10px 12px; border-radius: 12px; max-width: 100%; }
    .chat-bubble.user { background: #124ac6; color: #fff; align-self: flex-end; white-space: pre-wrap; }
    .chat-bubble.assistant { background: #121428; color: #e8eaf4; line-height: 1.5; }
    .chat-bubble.error { background: #3a1c28; color: #fca5a5; white-space: pre-wrap; }
    .chat-bubble.assistant p { margin: 0 0 0.55em; }
    .chat-bubble.assistant p:last-child,
    .chat-bubble.assistant ul:last-child,
    .chat-bubble.assistant ol:last-child,
    .chat-bubble.assistant .chat-md-table-wrap:last-child,
    .chat-bubble.assistant pre:last-child { margin-bottom: 0; }
    .chat-bubble.assistant strong { font-weight: 600; }
    .chat-bubble.assistant em { font-style: italic; }
    .chat-bubble.assistant h1, .chat-bubble.assistant h2,
    .chat-bubble.assistant h3, .chat-bubble.assistant h4 {
      margin: 0.15em 0 0.45em; font-size: 13px; font-weight: 650;
    }
    .chat-bubble.assistant code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11.5px; background: #2a3154; padding: 1px 5px; border-radius: 4px;
    }
    .chat-bubble.assistant pre {
      background: #0d0f1c; padding: 8px; border-radius: 8px; overflow-x: auto; margin: 0 0 0.6em;
    }
    .chat-bubble.assistant pre code { background: none; padding: 0; }
    .chat-md-table-wrap { overflow-x: auto; margin: 0 0 0.7em; }
    .chat-bubble.assistant table { border-collapse: collapse; width: 100%; font-size: 12px; }
    .chat-bubble.assistant th, .chat-bubble.assistant td {
      border: 1px solid #343c66; padding: 6px 8px; text-align: left; vertical-align: top;
      word-break: break-word;
    }
    .chat-bubble.assistant th { background: #2a3154; font-weight: 600; white-space: nowrap; }
    .chat-bubble.assistant ul, .chat-bubble.assistant ol { margin: 0 0 0.6em; padding-left: 1.25em; }
    .chat-bubble.assistant li { margin: 0.15em 0; }
    .chat-form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #2a3154; }
    .chat-form textarea {
      flex: 1; resize: none; min-height: 44px; max-height: 120px;
      background: #121428; color: #e8eaf4; border: 1px solid #343c66;
      border-radius: 8px; padding: 8px;
    }
    .chat-form button { width: auto; margin: 0; padding: 8px 14px; }
    .chat-sources { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chat-sources button {
      width: auto; margin: 0; padding: 3px 8px; font-size: 11px; font-weight: 500;
      background: #2a3154; color: #c9d0ee; border-radius: 999px;
    }
    .chat-secret {
      display: none; gap: 8px; padding: 8px 14px 0;
    }
    .chat-secret.is-on { display: flex; }
    .chat-secret input {
      flex: 1; background: #121428; color: #e8eaf4; border: 1px solid #343c66;
      border-radius: 8px; padding: 6px 8px;
    }
    svg { width: 100%; height: 100%; display: block; cursor: grab; }
    svg.is-panning { cursor: grabbing; }
    svg circle { cursor: pointer; }
    .label {
      fill: #ececec; font-size: 11px; pointer-events: none; text-anchor: middle;
      paint-order: stroke; stroke: #1a1a1a; stroke-width: 4px; stroke-linejoin: round;
    }
    .group-title {
      fill: #c8c8c8; font-size: 13px; font-weight: 650; text-anchor: middle;
      pointer-events: none; paint-order: stroke; stroke: #1a1a1a; stroke-width: 4px;
    }
    .hull { pointer-events: none; }
    .selected {
      position: absolute; left: 16px; bottom: 14px; margin: 0; max-width: calc(100% - 48px);
      color: #c9d0ee; background: rgba(18,20,40,.8); padding: 6px 10px; border-radius: 8px; z-index: 2;
    }
    .panel {
      background: #222; border-left: 1px solid #333; padding: 14px; overflow: auto;
    }
    details { margin-bottom: 16px; }
    summary { cursor: pointer; font-weight: 500; margin-bottom: 8px; }
    label { display: grid; gap: 6px; color: #c5cce6; margin-bottom: 10px; }
    .row { display: flex; align-items: center; gap: 8px; }
    .group { justify-content: space-between; }
    .group span:nth-child(2) { flex: 1; }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
    .count { color: #8b93b5; font-variant-numeric: tabular-nums; }
    input[type="search"] {
      width: 100%; background: #121428; color: #e8eaf4; border: 1px solid #343c66;
      border-radius: 8px; padding: 7px 8px;
    }
    input[type="range"] { width: 100%; }
    button {
      width: 100%; margin-top: 4px; background: #5eead4; color: #10222a; border: 0;
      border-radius: 8px; padding: 9px 10px; font-weight: 500; cursor: pointer;
    }
    button.ghost { background: #2a3154; color: #e8eaf4; }
    circle:focus { outline: 2px solid #5eead4; outline-offset: 2px; }
    @media (max-width: 800px) {
      .shell { grid-template-columns: 1fr; grid-template-rows: minmax(420px, 1fr) auto; }
      .shell.chat-open { grid-template-columns: 1fr; grid-template-rows: minmax(220px, 40vh) minmax(280px, 1fr) auto; }
      .panel { border-left: 0; border-top: 1px solid #2a3154; max-height: 46vh; }
    }
  </style>
</head>
<body>
  <div class="shell" id="shell">
    <aside class="chat-drawer" id="chat-drawer" aria-label="Ask the brain">
      <div class="chat-head">
        <span>Ask the brain</span>
        <button type="button" id="chat-close">Close</button>
      </div>
      <p class="chat-status" id="chat-status">Checking chat server…</p>
      <div class="chat-secret" id="chat-secret-row">
        <input id="chat-secret" type="password" autocomplete="off" placeholder="Shared secret">
      </div>
      <div class="chat-log" id="chat-log"></div>
      <form class="chat-form" id="chat-form">
        <textarea id="chat-input" rows="2" placeholder="Ask about credits, routes, MCP, screens…"></textarea>
        <button type="submit" id="chat-send">Ask</button>
      </form>
    </aside>
    <div class="stage">
      <p class="title">Graph view</p>
      <p class="hint">Color = folder · click a note · scroll to zoom</p>
      <div class="zoom-hud" aria-label="Zoom">
        <button type="button" id="chat-toggle" title="Ask the brain">Ask</button>
        <button type="button" id="zoom-in" title="Zoom in">+</button>
        <button type="button" id="zoom-out" title="Zoom out">−</button>
        <button type="button" id="zoom-fit" title="Fit">⤢</button>
      </div>
      <svg id="svg" role="img" aria-label="AI_BRAIN note link graph"></svg>
      <p class="selected" id="selected" hidden></p>
    </div>
    <aside class="panel" aria-label="Graph filters">
      <details open>
        <summary>Filters</summary>
        <label>Search notes
          <input id="search" type="search" placeholder="index, mcp, routes">
        </label>
        <label class="row"><input id="orphans" type="checkbox" checked> Orphans</label>
      </details>
      <details open>
        <summary>Groups</summary>
        <div id="groups"></div>
      </details>
      <details open>
        <summary>Display</summary>
        <label class="row"><input id="cluster" type="checkbox" checked> Keep folders nearby</label>
        <label class="row"><input id="hulls" type="checkbox"> Folder outlines</label>
        <label class="row"><input id="arrows" type="checkbox"> Arrows</label>
        <label>Show labels if links ≥ <output id="fade-out">0</output>
          <input id="fade" type="range" min="0" max="30" value="0">
        </label>
        <label>Node size <output id="nsize-out">1.0</output>
          <input id="nsize" type="range" min="0.5" max="2" step="0.1" value="1">
        </label>
        <label>Link thickness <output id="lthick-out">1.0</output>
          <input id="lthick" type="range" min="0.4" max="2.5" step="0.1" value="1">
        </label>
        <button type="button" id="animate">Animate</button>
        <button type="button" class="ghost" id="reset">Reset highlight</button>
      </details>
      <details>
        <summary>Forces</summary>
        <label>Center force <output id="center-out">0.06</output>
          <input id="center" type="range" min="0" max="1" step="0.05" value="0.06">
        </label>
        <label>Repel force <output id="repel-out">120</output>
          <input id="repel" type="range" min="10" max="200" step="5" value="120">
        </label>
        <label>Link force <output id="lforce-out">0.25</output>
          <input id="lforce" type="range" min="0" max="1" step="0.05" value="0.25">
        </label>
        <label>Link distance <output id="ldist-out">78</output>
          <input id="ldist" type="range" min="12" max="160" step="2" value="78">
        </label>
      </details>
    </aside>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>

  let zoomK = 1;
  let clusterCenters = {};
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const GROUP_ORDER = Object.keys(COLORS);

  function radius(d) {
    const scale = Number(nsizeEl.value);
    if (d.g === "brains") return 7.5 * scale;
    if (d.g === "frontal" || isHub(d)) return 6.2 * scale;
    return 5.2 * scale;
  }
  function isHub(d) {
    return /(?:^|\/)(?:README|index|AI_BRAIN|MINI-DESIGN-BRAIN|MASTER-DESIGN-BRAIN)\.md$/.test(d.id)
      || d.g === "brains";
  }
  function nodeById(id) {
    return nodes.find((n) => n.id === id);
  }
  function designSub(d) {
    if (d.g !== "design") return null;
    const m = d.id.match(/^design\/(\d{2}-[^/]+)\//);
    return m ? m[1] : "root";
  }
  const DESIGN_SUBS = [
    "01-Brand-Guidelines", "02-User-Interface", "03-Assets",
    "04-User-Flows", "05-Design-System", "06-Coverage", "root"
  ];
  function nodeHome(d) {
    const c = clusterCenters[d.g] || { x: worldW / 2, y: worldH / 2 };
    const sub = designSub(d);
    if (!sub) return c;
    const i = Math.max(0, DESIGN_SUBS.indexOf(sub));
    const ang = -Math.PI / 2 + (2 * Math.PI * i) / DESIGN_SUBS.length;
    const r = 130;
    return { x: c.x + Math.cos(ang) * r, y: c.y + Math.sin(ang) * r };
  }
  function titleFont() {
    return Math.max(13, 17 / Math.max(zoomK, 0.18));
  }
  function visible(d) {
    if (!groupOn[d.g]) return false;
    if (!orphanEl.checked && d.deg === 0) return false;
    const q = searchEl.value.trim().toLowerCase();
    if (!q) return true;
    return d.id.toLowerCase().includes(q) || d.label.toLowerCase().includes(q);
  }
  function sid(e) { return e.source.id || e.source; }
  function tid(e) { return e.target.id || e.target; }
  function connected(a, b) {
    return a === b || (adj.get(a) && adj.get(a).has(b));
  }

  function applyFilters() {
    if (!nodeSel) return;
    nodeSel.style("display", (d) => visible(d) ? null : "none");
    refreshLabels();
    linkSel.style("display", (d) => {
      const a = nodeById(sid(d));
      const b = nodeById(tid(d));
      return a && b && visible(a) && visible(b) ? null : "none";
    });
    nodeSel.attr("r", radius);
    linkSel.attr("stroke-width", Number(lthickEl.value) * 0.7);
    linkSel.attr("marker-end", arrowsEl.checked ? "url(#agv-arrow)" : null);
    paintFocus();
    drawClusters();
  }

  function labelVisible(d) {
    if (!visible(d)) return false;
    if (d.id === hoverId || d.id === selectedId) return true;
    const fade = Number(fadeEl.value);
    if (d.deg >= fade) return true;
    if (isHub(d)) return true;
    return false;
  }
  function refreshLabels() {
    if (!labelSel) return;
    const fade = Number(fadeEl.value);
    const shown = [];
    const ordered = nodes.slice().sort((a, b) => {
      const ah = isHub(a) || a.id === hoverId || a.id === selectedId ? 1 : 0;
      const bh = isHub(b) || b.id === hoverId || b.id === selectedId ? 1 : 0;
      return bh - ah || b.deg - a.deg;
    });
    const keep = new Set();
    ordered.forEach((d) => {
      if (!labelVisible(d)) return;
      if (fade === 0 || d.id === hoverId || d.id === selectedId || isHub(d)) {
        keep.add(d.id);
        return;
      }
      const w = Math.min(140, d.label.length * 6.2);
      const box = { x: d.x - w / 2, y: d.y + 8, w, h: 13 };
      const hit = shown.some((s) =>
        box.x < s.x + s.w && box.x + box.w > s.x && box.y < s.y + s.h && box.y + box.h > s.y
      );
      if (hit) return;
      shown.push(box);
      keep.add(d.id);
    });
    labelSel.style("display", (d) => keep.has(d.id) ? null : "none");
  }

  function paintFocus() {
    const focus = hoverId || selectedId;
    if (!focus) {
      nodeSel.attr("opacity", 1);
      linkSel.attr("stroke", (e) => {
        const a = nodeById(sid(e));
        const b = nodeById(tid(e));
        return a && b && a.g === b.g ? "rgba(200,200,200,0.28)" : "rgba(160,160,160,0.12)";
      });
      refreshLabels();
      return;
    }
    nodeSel.attr("opacity", (n) => connected(focus, n.id) ? 1 : 0.14);
    linkSel.attr("stroke", (e) => {
      const s = sid(e), t = tid(e);
      return s === focus || t === focus ? "rgba(255,255,255,0.55)" : "rgba(180,190,220,0.05)";
    });
    refreshLabels();
  }

  function pick(d) {
    selectedId = d.id;
    selectedEl.hidden = false;
    selectedEl.textContent = d.id + " · " + d.deg + " links · " + GROUP_LABEL[d.g];
    paintFocus();
  }

  function resetHighlight() {
    selectedId = null;
    hoverId = null;
    selectedEl.hidden = true;
    paintFocus();
  }

  function hullPath(members) {
    const pts = members.map((n) => [n.x, n.y]);
    const pad = 28;
    if (pts.length === 1) {
      const r = radius(members[0]) + pad;
      return `M ${pts[0][0] - r},${pts[0][1]} a ${r},${r} 0 1,0 ${r * 2},0 a ${r},${r} 0 1,0 ${-r * 2},0`;
    }
    const cx = d3.mean(pts, (p) => p[0]);
    const cy = d3.mean(pts, (p) => p[1]);
    const inflated = pts.map(([x, y]) => {
      const dx = x - cx, dy = y - cy;
      const len = Math.hypot(dx, dy) || 1;
      return [x + (dx / len) * pad, y + (dy / len) * pad];
    });
    if (inflated.length === 2) {
      inflated.push([cx, cy]);
    }
    const hull = d3.polygonHull(inflated);
    if (!hull) return null;
    return "M" + hull.map((p) => p.join(",")).join("L") + "Z";
  }
  function drawClusters() {
    if (!hullSel) return;
    const on = hullsEl && hullsEl.checked;
    const groups = on
      ? GROUP_ORDER.map((g) => [g, nodes.filter((n) => n.g === g && visible(n))]).filter(([, pts]) => pts.length)
      : [];
    hullSel = hullSel.data(groups, (d) => d[0]).join("path")
      .attr("class", "hull")
      .attr("fill", (d) => COLORS[d[0]])
      .attr("fill-opacity", 0.05)
      .attr("stroke", (d) => COLORS[d[0]])
      .attr("stroke-opacity", 0.25)
      .attr("stroke-width", 1)
      .attr("d", (d) => hullPath(d[1]));
    groupTitleSel = groupTitleSel.data(groups, (d) => d[0]).join("text")
      .attr("class", "group-title")
      .text((d) => GROUP_LABEL[d[0]])
      .attr("x", (d) => d3.mean(d[1], (n) => n.x))
      .attr("y", (d) => d3.min(d[1], (n) => n.y) - 18)
      .style("font-size", titleFont() + "px")
      .style("display", on ? null : "none");
  }

  function ticked() {
    if (!linkSel) return;
    linkSel
      .attr("x1", (d) => d.source.x).attr("y1", (d) => d.source.y)
      .attr("x2", (d) => d.target.x).attr("y2", (d) => d.target.y);
    nodeSel.attr("cx", (d) => d.x).attr("cy", (d) => d.y);
    labelSel.attr("x", (d) => d.x).attr("y", (d) => d.y + radius(d) + 12);
    drawClusters();
    refreshLabels();
  }

  function layoutClusters() {
    const cx = worldW / 2, cy = worldH / 2;
    const R = Math.min(worldW, worldH) * 0.42;
    const out = {};
    GROUP_ORDER.forEach((g, i) => {
      const ang = -Math.PI / 2 + (2 * Math.PI * i) / GROUP_ORDER.length;
      const count = DATA.nodes.filter((n) => n.g === g).length;
      const bump = Math.min(70, Math.sqrt(count) * 8);
      out[g] = { x: cx + Math.cos(ang) * (R + bump * 0.15), y: cy + Math.sin(ang) * (R + bump * 0.15) };
    });
    return out;
  }

  function applyForces() {
    if (!sim) return;
    const center = Number(centerEl.value);
    const repel = Number(repelEl.value);
    const lforce = Number(lforceEl.value);
    const ldist = Number(ldistEl.value);
    const clustered = clusterEl.checked;
    clusterCenters = layoutClusters();
    sim.force("link", d3.forceLink(links).id((d) => d.id)
      .distance((d) => {
        const a = d.source.g || nodeById(sid(d))?.g;
        const b = d.target.g || nodeById(tid(d))?.g;
        const hub = sid(d) === "index.md" || tid(d) === "index.md";
        if (hub) return clustered ? 160 : ldist * 1.15;
        return a === b ? ldist : ldist * (clustered ? 1.85 : 1.35);
      })
      .strength((d) => {
        const a = d.source.g || nodeById(sid(d))?.g;
        const b = d.target.g || nodeById(tid(d))?.g;
        const hub = sid(d) === "index.md" || tid(d) === "index.md";
        if (hub) return clustered ? 0.02 : lforce * 0.25;
        if (a === b) return Math.min(0.85, lforce + 0.25);
        return clustered ? 0.035 : lforce * 0.4;
      }));
    sim.force("charge", d3.forceManyBody().strength((d) => d.deg === 0 ? -40 : -repel - Math.min(d.deg, 20) * 1.2));
    sim.force("center", d3.forceCenter(worldW / 2, worldH / 2).strength(clustered ? Math.min(center, 0.08) : center));
    sim.force("collide", d3.forceCollide().radius((d) => radius(d) + (isHub(d) ? 18 : 12)).iterations(2));
    if (clustered) {
      sim.force("x", d3.forceX((d) => nodeHome(d).x).strength(0.05));
      sim.force("y", d3.forceY((d) => nodeHome(d).y).strength(0.05));
      sim.force("radial", null);
    } else {
      sim.force("x", null);
      sim.force("y", null);
      sim.force("radial", d3.forceRadial(
        (d) => d.deg === 0 ? Math.min(worldW, worldH) * 0.42 : 0,
        worldW / 2, worldH / 2
      ).strength((d) => d.deg === 0 && orphanEl.checked ? 0.9 : 0));
    }
  }

  function sizeSvg() {
    const rect = svgEl.getBoundingClientRect();
    const width = Math.max(320, Math.floor(rect.width));
    const height = Math.max(420, Math.floor(rect.height));
    svg.attr("viewBox", `0 0 ${width} ${height}`);
    return { width, height };
  }

  function fitView(kPad, instant) {
    const vis = nodes.filter(visible);
    if (!vis.length || !zoom) return;
    const { width, height } = sizeSvg();
    const xs = vis.map((n) => n.x);
    const ys = vis.map((n) => n.y);
    const minX = Math.min.apply(null, xs);
    const maxX = Math.max.apply(null, xs);
    const minY = Math.min.apply(null, ys);
    const maxY = Math.max.apply(null, ys);
    const bw = Math.max(40, maxX - minX);
    const bh = Math.max(40, maxY - minY);
    const pad = 72;
    const k = Math.min((width - pad) / bw, (height - pad) / bh, 4) * (kPad || 0.92);
    const cx = (minX + maxX) / 2;
    const cy = (minY + maxY) / 2;
    const t = d3.zoomIdentity.translate(width / 2, height / 2).scale(k).translate(-cx, -cy);
    zoomK = k;
    if (viewport) viewport.attr("transform", t);
    if (instant || reduce) svg.call(zoom.transform, t);
    else svg.transition().duration(350).call(zoom.transform, t);
  }

  function zoomBy(factor) {
    svg.transition().duration(reduce ? 0 : 180).call(zoom.scaleBy, factor);
  }

  function zoomToNode(d) {
    const { width, height } = sizeSvg();
    const t = d3.zoomIdentity.translate(width / 2, height / 2).scale(2.4).translate(-d.x, -d.y);
    svg.transition().duration(reduce ? 0 : 280).call(zoom.transform, t);
  }

  function dragged(event, d) {
    d.fx = event.x;
    d.fy = event.y;
  }

  function dragstarted(event, d) {
    event.sourceEvent.stopPropagation();
    if (!event.active) sim.alphaTarget(0.25).restart();
    d.fx = d.x;
    d.fy = d.y;
  }

  function dragended(event, d) {
    if (!event.active) sim.alphaTarget(0);
  }

  function init() {
    const { width, height } = sizeSvg();
    worldW = 2200;
    worldH = 1500;
    clusterCenters = layoutClusters();
    nodes.forEach((n) => {
      const home = nodeHome(n);
      n.x = home.x + (Math.random() - 0.5) * 90;
      n.y = home.y + (Math.random() - 0.5) * 90;
    });

    svg.selectAll("*").remove();
    svg.append("defs").append("marker")
      .attr("id", "agv-arrow")
      .attr("viewBox", "0 -4 8 8")
      .attr("refX", 10)
      .attr("refY", 0)
      .attr("markerWidth", 6)
      .attr("markerHeight", 6)
      .attr("orient", "auto")
      .append("path")
      .attr("d", "M0,-4L8,0L0,4")
      .attr("fill", "rgba(200,210,240,0.7)");

    viewport = svg.append("g").attr("class", "viewport");
    const hullG = viewport.append("g").attr("class", "hulls");
    const linkG = viewport.append("g").attr("class", "links");
    const nodeG = viewport.append("g").attr("class", "nodes");
    const titleG = viewport.append("g").attr("class", "group-titles");
    const textG = viewport.append("g").attr("class", "labels");
    hullSel = hullG.selectAll("path");
    groupTitleSel = titleG.selectAll("text");

    zoom = d3.zoom()
      .scaleExtent([0.12, 8])
      .filter((event) => {
        if (event.type === "wheel") return true;
        if (event.type === "touchstart" && event.touches && event.touches.length > 1) return true;
        if (event.target && event.target.tagName === "circle") return false;
        return event.button === 0;
      })
      .on("start", () => svgEl.classList.add("is-panning"))
      .on("end", () => svgEl.classList.remove("is-panning"))
      .on("zoom", (event) => {
        viewport.attr("transform", event.transform);
        zoomK = event.transform.k;
        refreshLabels();
        if (groupTitleSel) groupTitleSel.style("font-size", titleFont() + "px");
      });

    svg.call(zoom);
    svg.on("dblclick.zoom", null);

    svg.on("click", (event) => {
      if (event.target === svgEl) resetHighlight();
    });

    linkSel = linkG.selectAll("line").data(links).enter().append("line")
      .attr("stroke", "rgba(180,180,180,0.22)")
      .attr("stroke-width", 0.8);

    nodeSel = nodeG.selectAll("circle").data(nodes).enter().append("circle")
      .attr("fill", (d) => COLORS[d.g])
      .attr("stroke", "none")
      .attr("tabindex", 0)
      .attr("role", "button")
      .attr("aria-label", (d) => `${d.label}, ${d.id}, ${d.deg} links`)
      .call(d3.drag()
        .container(viewport.node())
        .on("start", dragstarted)
        .on("drag", dragged)
        .on("end", dragended))
      .on("click", (event, d) => {
        event.stopPropagation();
        if (event.defaultPrevented) return;
        pick(d);
      })
      .on("dblclick", (event, d) => {
        event.stopPropagation();
        pick(d);
        zoomToNode(d);
      })
      .on("mouseenter", (event, d) => { hoverId = d.id; paintFocus(); })
      .on("mouseleave", () => { hoverId = null; paintFocus(); })
      .on("keydown", (event, d) => {
        if (event.key === "Enter" || event.key === " ") { event.preventDefault(); pick(d); }
      });

    labelSel = textG.selectAll("text").data(nodes).enter().append("text")
      .attr("class", "label")
      .text((d) => d.label);

    sim = d3.forceSimulation(nodes);
    applyForces();
    sim.on("tick", ticked);
    sim.stop();
    for (let i = 0; i < 420; i++) sim.tick();
    ticked();
    applyFilters();
    fitView(0.88, true);
    setTimeout(() => fitView(0.88, true), 200);
  }

  if (!window.d3) {
    selectedEl.hidden = false;
    selectedEl.textContent = "Could not load D3. Check your network, then refresh.";
  } else {
    init();
    window.addEventListener("resize", () => {
      sizeSvg();
      fitView(0.88, true);
    });
  }

  fadeEl.addEventListener("input", () => {
    document.getElementById("fade-out").textContent = fadeEl.value;
    applyFilters();
  });
  nsizeEl.addEventListener("input", () => {
    document.getElementById("nsize-out").textContent = Number(nsizeEl.value).toFixed(1);
    applyFilters();
  });
  lthickEl.addEventListener("input", () => {
    document.getElementById("lthick-out").textContent = Number(lthickEl.value).toFixed(1);
    applyFilters();
  });
  clusterEl.addEventListener("change", () => {
    applyForces();
    if (sim) {
      nodes.forEach((n) => { n.fx = null; n.fy = null; });
      sim.alpha(0.85).restart();
    }
    applyFilters();
    setTimeout(() => fitView(0.9), reduce ? 0 : 700);
  });
  arrowsEl.addEventListener("change", applyFilters);
  hullsEl.addEventListener("change", () => { drawClusters(); });
  searchEl.addEventListener("input", applyFilters);
  orphanEl.addEventListener("change", () => {
    applyForces();
    if (sim) sim.alpha(0.4).restart();
    applyFilters();
  });
  function retune() {
    document.getElementById("center-out").textContent = Number(centerEl.value).toFixed(2);
    document.getElementById("repel-out").textContent = String(Math.round(Number(repelEl.value)));
    document.getElementById("lforce-out").textContent = Number(lforceEl.value).toFixed(2);
    document.getElementById("ldist-out").textContent = String(Math.round(Number(ldistEl.value)));
    applyForces();
    if (sim) sim.alpha(0.35).restart();
  }
  ["center", "repel", "lforce", "ldist"].forEach((id) => {
    document.getElementById(id).addEventListener("input", retune);
  });
  document.getElementById("animate").addEventListener("click", () => {
    if (!sim || reduce) return;
    nodes.forEach((n) => { n.fx = null; n.fy = null; });
    sim.alpha(0.85).restart();
  });
  document.getElementById("reset").addEventListener("click", resetHighlight);
  document.getElementById("zoom-in").addEventListener("click", () => zoomBy(1.25));
  document.getElementById("zoom-out").addEventListener("click", () => zoomBy(0.8));
  document.getElementById("zoom-fit").addEventListener("click", () => fitView(0.92));

  const shell = document.getElementById("shell");
  const chatStatus = document.getElementById("chat-status");
  const chatLog = document.getElementById("chat-log");
  const chatInput = document.getElementById("chat-input");
  const chatHistory = [];

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }
  function inlineMd(s) {
    return s
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>");
  }
  function isTableSep(line) {
    return /^\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?$/.test(line.trim());
  }
  function splitCells(line) {
    return line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());
  }
  function renderMarkdown(src) {
    const fences = [];
    const text = escapeHtml(src).replace(/```[\t ]*[\w-]*\n?([\s\S]*?)```/g, (_, code) => {
      const i = fences.length;
      fences.push("<pre><code>" + code.replace(/^\n+|\n+$/g, "") + "</code></pre>");
      return "\n%%FENCE" + i + "%%\n";
    });
    const lines = text.split("\n");
    const out = [];
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      const fence = line.trim().match(/^%%FENCE(\d+)%%$/);
      if (fence) {
        out.push(fences[Number(fence[1])]);
        i += 1;
        continue;
      }
      if (line.includes("|") && i + 1 < lines.length && isTableSep(lines[i + 1])) {
        const header = splitCells(line);
        i += 2;
        const body = [];
        while (i < lines.length && lines[i].includes("|") && !isTableSep(lines[i])) {
          body.push(splitCells(lines[i]));
          i += 1;
        }
        let html = '<div class="chat-md-table-wrap"><table><thead><tr>';
        header.forEach((c) => { html += "<th>" + inlineMd(c) + "</th>"; });
        html += "</tr></thead><tbody>";
        body.forEach((row) => {
          html += "<tr>";
          header.forEach((_, idx) => { html += "<td>" + inlineMd(row[idx] || "") + "</td>"; });
          html += "</tr>";
        });
        html += "</tbody></table></div>";
        out.push(html);
        continue;
      }
      if (/^\s*[-*] /.test(line)) {
        out.push("<ul>");
        while (i < lines.length && /^\s*[-*] /.test(lines[i])) {
          out.push("<li>" + inlineMd(lines[i].replace(/^\s*[-*] /, "")) + "</li>");
          i += 1;
        }
        out.push("</ul>");
        continue;
      }
      if (/^\s*\d+\. /.test(line)) {
        out.push("<ol>");
        while (i < lines.length && /^\s*\d+\. /.test(lines[i])) {
          out.push("<li>" + inlineMd(lines[i].replace(/^\s*\d+\. /, "")) + "</li>");
          i += 1;
        }
        out.push("</ol>");
        continue;
      }
      if (/^#{1,4}\s+/.test(line.trim())) {
        const level = Math.min(4, line.trim().match(/^#+/)[0].length);
        out.push("<h" + level + ">" + inlineMd(line.trim().replace(/^#{1,4}\s+/, "")) + "</h" + level + ">");
        i += 1;
        continue;
      }
      if (!line.trim()) {
        i += 1;
        continue;
      }
      const para = [];
      while (i < lines.length && lines[i].trim() && !/^\s*[-*] /.test(lines[i]) && !/^\s*\d+\. /.test(lines[i]) && !/^%%FENCE/.test(lines[i].trim()) && !/^#{1,4}\s+/.test(lines[i].trim())) {
        if (lines[i].includes("|") && i + 1 < lines.length && isTableSep(lines[i + 1])) break;
        para.push(lines[i]);
        i += 1;
      }
      if (!para.length) {
        out.push("<p>" + inlineMd(line) + "</p>");
        i += 1;
        continue;
      }
      out.push("<p>" + inlineMd(para.join(" ")) + "</p>");
    }
    return out.join("");
  }
  function addBubble(role, text) {
    const el = document.createElement("div");
    el.className = "chat-bubble " + role;
    if (role === "assistant") el.innerHTML = renderMarkdown(text);
    else el.textContent = text;
    chatLog.appendChild(el);
    chatLog.scrollTop = chatLog.scrollHeight;
    return el;
  }
  function renderSources(el, sources) {
    if (!el || !sources || !sources.length) return;
    const wrap = document.createElement("div");
    wrap.className = "chat-sources";
    sources.forEach((path) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = path;
      b.title = "Select this note on the graph";
      b.addEventListener("click", () => {
        const n = nodeById(path);
        if (n) pick(n);
      });
      wrap.appendChild(b);
    });
    el.appendChild(wrap);
  }
  function chatHeaders() {
    const headers = { "content-type": "application/json" };
    const secret = (document.getElementById("chat-secret").value || localStorage.getItem("brain_secret") || "").trim();
    if (secret) {
      headers["x-brain-secret"] = secret;
      localStorage.setItem("brain_secret", secret);
    }
    return headers;
  }
  async function readChatResponse(res, bubble) {
    const ctype = res.headers.get("content-type") || "";
    if (ctype.includes("text/event-stream") && res.body) {
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      let text = "";
      let sources = [];
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const parts = buf.split("\n\n");
        buf = parts.pop() || "";
        for (const block of parts) {
          const line = block.split("\n").find((l) => l.startsWith("data:"));
          if (!line) continue;
          let ev;
          try { ev = JSON.parse(line.slice(5).trim()); } catch { continue; }
          if (ev.type === "delta" && ev.data) {
            text += ev.data;
            bubble.innerHTML = renderMarkdown(text);
            chatLog.scrollTop = chatLog.scrollHeight;
          } else if (ev.type === "error") {
            bubble.className = "chat-bubble error";
            bubble.textContent = ev.data || "Chat error.";
          } else if (ev.type === "done") {
            sources = Array.isArray(ev.data) ? ev.data : [];
          }
        }
      }
      renderSources(bubble, sources);
      return { reply: text, sources };
    }
    const data = await res.json();
    const reply = data.reply || data.error || "No reply.";
    if (data.error && !data.reply) {
      bubble.className = "chat-bubble error";
      bubble.textContent = reply;
    } else {
      bubble.innerHTML = renderMarkdown(reply);
    }
    renderSources(bubble, data.sources);
    return data;
  }

  function setChatOpen(on) {
    shell.classList.toggle("chat-open", on);
    if (typeof sizeSvg === "function") sizeSvg();
    if (on) chatInput.focus();
  }

  document.getElementById("chat-toggle").addEventListener("click", () => {
    setChatOpen(!shell.classList.contains("chat-open"));
  });
  document.getElementById("chat-close").addEventListener("click", () => setChatOpen(false));

  const savedSecret = localStorage.getItem("brain_secret") || "";
  if (savedSecret) document.getElementById("chat-secret").value = savedSecret;
  fetch("/api/health").then((r) => r.json()).then((info) => {
    const row = document.getElementById("chat-secret-row");
    if (info.auth_required) {
      row.classList.add("is-on");
      chatStatus.textContent = info.has_key
        ? "Ask is locked. Enter the shared secret, then click a node to focus a note."
        : "Ask is locked, and ANTHROPIC_API_KEY is missing.";
    } else if (info.has_key) {
      chatStatus.textContent = "Claude is ready. Click a node to focus that note.";
    } else {
      chatStatus.textContent = "No ANTHROPIC_API_KEY. Copy .env.example to .env and restart graph-server.py.";
    }
  }).catch(() => {
    chatStatus.textContent = "Open this page via graph-server.py (http://127.0.0.1:8765/graph.html), not as a file.";
  });

  document.getElementById("chat-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const message = chatInput.value.trim();
    if (!message) return;
    chatInput.value = "";
    addBubble("user", message);
    chatHistory.push({ role: "user", content: message });
    const sendBtn = document.getElementById("chat-send");
    sendBtn.disabled = true;
    const bubble = addBubble("assistant", "…");
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: chatHeaders(),
        body: JSON.stringify({
          message,
          selected: selectedId || null,
          history: chatHistory.slice(0, -1),
          stream: true
        })
      });
      if (res.status === 401) {
        document.getElementById("chat-secret-row").classList.add("is-on");
        bubble.className = "chat-bubble error";
        bubble.textContent = "Ask is locked. Enter the shared secret.";
        sendBtn.disabled = false;
        return;
      }
      const data = await readChatResponse(res, bubble);
      const reply = data.reply || data.error || "";
      if (reply && !data.error) chatHistory.push({ role: "assistant", content: reply });
    } catch (err) {
      bubble.className = "chat-bubble error";
      bubble.textContent = "Chat server is not running. Start: python3 AI_BRAIN/graph-server.py";
    }
    sendBtn.disabled = false;
  });
  chatInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      document.getElementById("chat-form").requestSubmit();
    }
  });
  </script>
</body>
