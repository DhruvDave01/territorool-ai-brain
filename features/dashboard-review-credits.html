<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — Want 50 more credits?</title>
  <style>
    :root {
      --primary: #124ac6;
      --surface: #F6F7FB;
      --banner: #E0E7FF;
      --unread: #F0F4FF;
      --text: #111827;
      --muted: #64748B;
      --secondary: #6B7280;
      --border: #E5E7EB;
      --border-subtle: #E8EAED;
      --header: #F6F7FB;
      --tab: #F3F4F6;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      min-height: 100%;
      background: #0e0e0e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 12px 0 24px;
    }
    .phone {
      width: 402px;
      height: 874px;
      background: #000;
      border-radius: 48px;
      padding: 10px;
      box-shadow: 0 16px 40px rgba(0,0,0,.35);
    }
    .screen {
      height: 100%;
      border-radius: 40px;
      overflow: hidden;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .header {
      background: linear-gradient(180deg, #124ac6 0%, #164fca 18%, #1b54cf 36%, #2059d3 54%, #255ed7 72%, #2963db 86%, #124ac6 100%);
      color: var(--header);
      padding: 8px 18px 16px;
    }
    .status {
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 15px;
      font-weight: 600;
      padding: 0 8px;
    }
    .island {
      width: 96px;
      height: 28px;
      border-radius: 16px;
      background: #000;
    }
    .status-right { display: flex; align-items: center; gap: 6px; }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      gap: 10px;
    }
    .who { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .logo {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: #fff;
      padding: 4px;
      border: 0.5px solid rgba(255,255,255,.55);
      object-fit: cover;
    }
    .name {
      font-size: 21px;
      line-height: 25px;
      font-weight: 400;
    }
    .actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .pill {
      height: 48px;
      border-radius: 12px;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.18);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(246,247,251,.95);
    }
    .credits { padding: 0 10px; gap: 5px; font-size: 13px; font-weight: 600; }
    .icon-pill { width: 48px; }
    .sheet {
      flex: 1;
      min-height: 0;
      background: var(--surface);
      border-top-left-radius: 25px;
      border-top-right-radius: 25px;
      overflow: auto;
      margin-top: -1px;
    }
    .banner {
      width: 100%;
      display: flex;
      align-items: center;
      padding: 12px 16px;
      background: var(--banner);
      border: 0;
      border-bottom: 0.5px solid var(--border-subtle);
      border-top-left-radius: 25px;
      border-top-right-radius: 25px;
      color: var(--primary);
      font-family: inherit;
      font-size: 14px;
      line-height: 18px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
    }
    .banner span { flex: 1; min-width: 0; padding-right: 4px; }
    .banner .gift { margin-right: 6px; flex: 0 0 auto; }
    .banner .chev { color: var(--secondary); flex: 0 0 auto; }
    .body { padding: 12px 16px 32px; }
    .grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
    }
    .tile {
      width: 48%;
      min-height: 96px;
      margin-bottom: 8px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      position: relative;
      overflow: visible;
      box-shadow: 0 1px 2px rgba(0,0,0,.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-bottom: 4px;
    }
    .tile.unread {
      background: var(--unread);
      border: 1.5px solid var(--primary);
    }
    .tile img {
      width: 30px;
      height: 30px;
      object-fit: contain;
      margin-top: 6px;
      filter: brightness(0) saturate(100%) invert(22%) sepia(85%) saturate(3200%) hue-rotate(214deg) brightness(92%) contrast(98%);
    }
    .tile h3 {
      margin: 0;
      font-size: 13px;
      line-height: 16px;
      font-weight: 600;
      color: var(--text);
      text-align: center;
      font-family: inherit;
    }
    .tile .sub {
      margin: 2px 0 0;
      font-size: 11px;
      line-height: 14px;
      font-weight: 500;
      color: var(--primary);
      text-align: center;
    }
    .tile.tagged .label { padding-bottom: 16px; }
    .tile.unread.tagged .label { padding-bottom: 22px; }
    .tag {
      position: absolute;
      left: 0;
      bottom: 0;
      max-width: 78%;
      background: var(--banner);
      color: var(--primary);
      font-size: 7.5px;
      line-height: 8px;
      font-weight: 700;
      letter-spacing: .3px;
      text-transform: uppercase;
      padding: 3px 6px 3px 7px;
      border-top-right-radius: 8px;
      border-bottom-left-radius: 12px;
    }
    .badge {
      position: absolute;
      top: 6px;
      right: 6px;
      min-width: 20px;
      height: 20px;
      padding: 0 5px;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .activity { padding-top: 16px; }
    .activity-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .activity h2 {
      margin: 0;
      font-size: 18px;
      line-height: 22px;
      font-weight: 700;
    }
    .when {
      margin: 2px 0 0;
      font-size: 12px;
      line-height: 16px;
      font-weight: 500;
      color: var(--muted);
    }
    .cal {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1.5px solid var(--primary);
      background: #fff;
      color: var(--primary);
      font-family: inherit;
      font-size: 14px;
      line-height: 18px;
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(0,0,0,.08);
    }
    .tabs {
      display: flex;
      background: var(--tab);
      border-radius: 12px;
      padding: 3px;
      margin: 10px 0 6px;
      border: 1px solid rgba(0,0,0,.04);
    }
    .tabs span {
      flex: 1;
      text-align: center;
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      font-size: 15px;
      line-height: 18px;
      font-weight: 600;
      letter-spacing: -0.2px;
      color: var(--secondary);
    }
    .tabs .on {
      background: #fff;
      color: var(--primary);
      box-shadow: 0 1px 2px rgba(0,0,0,.08);
    }
    .empty {
      margin: 0;
      padding: 20px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }
    .version {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 16px 18px;
      color: var(--muted);
      font-size: 11px;
      line-height: 14px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 4px;
      background: #F59E0B;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="screen">
      <header class="header">
        <div class="status">
          <span>1:45</span>
          <div class="island" aria-hidden="true"></div>
          <div class="status-right" aria-hidden="true">
            <svg width="17" height="12" viewBox="0 0 17 12" fill="#F6F7FB"><rect x="0" y="7" width="3" height="5" rx="0.5"/><rect x="4.5" y="5" width="3" height="7" rx="0.5"/><rect x="9" y="2.5" width="3" height="9.5" rx="0.5"/><rect x="13.5" y="0" width="3" height="12" rx="0.5"/></svg>
            <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="2" stroke="#F6F7FB"/><rect x="2" y="2" width="16" height="8" rx="1" fill="#F6F7FB"/><rect x="22.5" y="3.5" width="2" height="5" rx="0.5" fill="#F6F7FB"/></svg>
          </div>
        </div>
        <div class="row">
          <div class="who">
            <img class="logo" src="../assets/images/mobile/TerriTool_logo_NEW.jpg" alt="">
            <div class="name">Ann</div>
          </div>
          <div class="actions">
            <div class="pill credits">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#F6F7FB" stroke-width="1.8"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg>
              8486 Credits
            </div>
            <div class="pill icon-pill" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F6F7FB" stroke-width="1.7"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><path d="M14 17h6M17 14v6"/></svg>
            </div>
            <div class="pill icon-pill" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F6F7FB" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg>
            </div>
          </div>
        </div>
      </header>
      <div class="sheet">
        <button class="banner" type="button" aria-label="Want 50 more credits?">
          <svg class="gift" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#124ac6" stroke-width="2"><path d="M20 12v8H4v-8"/><path d="M2 7h20v5H2z"/><path d="M12 22V7"/><path d="M12 7c0-2 1.5-4 4-4 0 2-1 4-4 4zM12 7c0-2-1.5-4-4-4 0 2 1 4 4 4z"/></svg>
          <span>Want 50 more credits?</span>
          <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <div class="body">
          <div class="grid">
            <div class="tile tagged">
              <img src="../assets/images/mobile/ai_findleads.png" alt="">
              <div class="label"><h3>AI Find Leads</h3></div>
              <div class="tag">Leads &amp; contacts</div>
            </div>
            <div class="tile tagged">
              <img src="../assets/images/mobile/scan_card.png" alt="">
              <div class="label"><h3>Scan Card</h3></div>
              <div class="tag">Powered by AI</div>
            </div>
            <div class="tile">
              <img src="../assets/images/mobile/recently_added.png" alt="">
              <div class="label"><h3>Add Company</h3></div>
            </div>
            <div class="tile unread tagged">
              <div class="badge">37</div>
              <img src="../assets/images/mobile/icon_routes.png" alt="">
              <div class="label"><h3>Routes</h3><p class="sub">New route ready</p></div>
              <div class="tag">Powered by AI</div>
            </div>
            <div class="tile unread">
              <div class="badge">30</div>
              <img src="../assets/images/mobile/Supply3.png" alt="">
              <div class="label"><h3>Lists</h3><p class="sub">New list ready</p></div>
            </div>
            <div class="tile">
              <img src="../assets/images/mobile/icon_company.png" alt="">
              <div class="label"><h3>Address Book</h3></div>
            </div>
          </div>
          <section class="activity">
            <div class="activity-head">
              <div>
                <h2>Activity</h2>
                <p class="when">Tue, Sep 22 · 8:15 AM PT</p>
              </div>
              <button class="cal" type="button">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#124ac6" stroke-width="1.8"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>
                Calendar
              </button>
            </div>
            <div class="tabs"><span class="on">Upcoming</span><span>Recent</span></div>
            <p class="empty">No upcoming activities yet.</p>
          </section>
          <div class="version"><span class="dot"></span>iOS 42.31 (1)</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
