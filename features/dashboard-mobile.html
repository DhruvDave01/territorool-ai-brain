<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dashboard</title>
  <style>
    :root {
      --blue: #124ac6;
      --sheet: #f6f7fb;
      --card: #fff;
      --line: #e5e7eb;
      --ink: #111827;
      --muted: #64748b;
      --tag: #e0e7ff;
      --unread: #f0f4ff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #124ac6; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: var(--ink);
    }
    .phone {
      width: 100%;
      min-height: 100%;
      margin: 0 auto;
      background: linear-gradient(180deg, #124ac6 0%, #1b54cf 38%, #2963db 100%);
      display: flex;
      flex-direction: column;
    }
    .status {
      height: 72px;
      padding: 8px 28px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
    }
    .status-icons { display: flex; gap: 6px; align-items: center; }
    .hdr {
      background: linear-gradient(180deg, #124ac6 0%, #1b54cf 42%, #2963db 78%, #124ac6 100%);
      padding: 4px 22px 14px;
    }
    .hdr-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .who { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .mark {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: #fff;
      padding: 4px;
      object-fit: contain;
    }
    .name { color: #f6f7fb; font-size: 21px; font-weight: 600; }
    .actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .pill {
      height: 40px;
      border-radius: 12px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.18);
      color: rgba(246,247,251,0.95);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .credits { padding: 0 8px; gap: 4px; font-size: 12px; font-weight: 600; white-space: nowrap; }
    .sq { width: 40px; }
    .sheet {
      flex: 1;
      background: var(--sheet);
      border-top-left-radius: 25px;
      border-top-right-radius: 25px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .banner {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 12px 22px;
      background: #e0e7ff;
      border-bottom: 1px solid #e8eaed;
      color: var(--blue);
      font-size: 14px;
      font-weight: 600;
    }
    .banner span { flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .banner small { font-size: 10px; font-weight: 400; }
    .body { padding: 12px 22px 24px; }
    .grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
    }
    .tile {
      width: 48%;
      min-height: 118px;
      margin-bottom: 8px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 6px 10px;
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.06);
      text-align: center;
    }
    .tile.unread {
      border: 1.5px solid var(--blue);
      background: var(--unread);
    }
    .tile.has-tag { padding-bottom: 22px; min-height: 128px; }
    .ico {
      width: 34px;
      height: 34px;
      object-fit: contain;
      filter: brightness(0) saturate(100%) invert(18%) sepia(91%) saturate(3200%) hue-rotate(214deg) brightness(92%) contrast(98%);
    }
    .tile b { display: block; margin-top: 6px; font-size: 13px; font-weight: 600; }
    .tile em {
      display: block;
      margin-top: 2px;
      font-style: normal;
      font-size: 11px;
      font-weight: 500;
      color: var(--blue);
    }
    .tag {
      position: absolute;
      left: 0;
      bottom: 0;
      max-width: 78%;
      background: var(--tag);
      color: var(--blue);
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      padding: 3px 6px 3px 7px;
      border-top-right-radius: 8px;
    }
    .badge {
      position: absolute;
      top: 6px;
      right: 6px;
      min-width: 20px;
      height: 20px;
      padding: 0 5px;
      border-radius: 10px;
      background: var(--blue);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .activity { padding-top: 16px; }
    .act-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .act-head h2 { margin: 0; font-size: 18px; font-weight: 700; }
    .act-head p { margin: 2px 0 0; font-size: 12px; font-weight: 500; color: var(--muted); }
    .cal {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      white-space: nowrap;
      border-radius: 10px;
      border: 1.5px solid var(--blue);
      background: #fff;
      color: var(--blue);
      font-size: 14px;
      font-weight: 600;
    }
    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(16, 24, 40, 0.05);
    }
    .tabs {
      display: flex;
      margin: 10px 12px 6px;
      padding: 3px;
      background: #f3f4f6;
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,0.04);
    }
    .tabs button {
      flex: 1;
      height: 46px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: #6b7280;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .tabs button.on {
      background: #fff;
      color: var(--blue);
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.08);
    }
    .row {
      margin: 0 12px 10px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fafafa;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .row:first-of-type { margin-top: 8px; }
    .row:last-child { margin-bottom: 14px; }
    .bubble {
      width: 44px;
      height: 44px;
      border-radius: 22px;
      border: 0.5px solid var(--blue);
      background: #eef2f6;
      color: var(--blue);
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 44px;
    }
    .row strong { display: block; font-size: 16px; }
    .row small { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
    .mid { flex: 1; min-width: 0; }
    .when { color: var(--muted); font-size: 12px; text-align: right; margin-right: 8px; white-space: nowrap; }
    .chip {
      border: 1px solid var(--blue);
      color: var(--blue);
      background: rgba(18, 74, 198, 0.12);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
    }
    .empty {
      margin: 0;
      padding: 28px 20px 36px;
      text-align: center;
      color: var(--muted);
      font-size: 15px;
    }
    .ver {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      padding: 16px 18px 8px;
      color: var(--muted);
      font-size: 11px;
    }
    .dot { width: 8px; height: 8px; border-radius: 4px; background: #f59e0b; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="status">
      <span>1:45</span>
      <span class="status-icons" aria-hidden="true">
        <svg width="17" height="12" viewBox="0 0 17 12" fill="#fff"><rect x="0" y="7" width="3" height="5" rx="0.5"/><rect x="4.5" y="5" width="3" height="7" rx="0.5"/><rect x="9" y="2.5" width="3" height="9.5" rx="0.5"/><rect x="13.5" y="0" width="3" height="12" rx="0.5"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="#fff"><path d="M8 2.2c2 0 3.8.8 5.1 2.1l1.1-1.2A8.7 8.7 0 0 0 8 0 8.7 8.7 0 0 0 1.8 3.1L2.9 4.3A7 7 0 0 1 8 2.2zM8 6c1.1 0 2.1.4 2.8 1.1l1.2-1.2A5.4 5.4 0 0 0 8 4.4c-1.5 0-2.8.6-3.8 1.5L5.3 7A3.8 3.8 0 0 1 8 6zm0 3.2a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6z"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="#fff"><rect x="0" y="1" width="22" height="10" rx="2" stroke="#fff" fill="none"/><rect x="2" y="3" width="16" height="6" rx="1"/><rect x="22.5" y="4" width="1.5" height="4" rx="0.5"/></svg>
      </span>
    </div>
    <header class="hdr">
      <div class="hdr-row">
        <div class="who">
          <img class="mark" src="../assets/images/mobile/TerriTool_logo_NEW.jpg" alt="TerriTool">
          <div class="name">Ann</div>
        </div>
        <div class="actions">
          <div class="pill credits">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f6f7fb" stroke-width="1.8"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1"/></svg>
            8486 Credits
          </div>
          <button class="pill sq" type="button" aria-label="Scan QR code">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f6f7fb" stroke-width="1.7"><path d="M4 8V5h3M16 5h3v3M20 16v3h-3M8 19H5v-3"/><rect x="8" y="8" width="3" height="3"/><rect x="13" y="8" width="3" height="3"/><rect x="8" y="13" width="3" height="3"/><path d="M13 13h3v3h-1"/></svg>
          </button>
          <button class="pill sq" type="button" aria-label="Settings">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f6f7fb" stroke-width="1.7"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/><path d="M19.4 13a7.7 7.7 0 0 0 .1-2l2-1.2-2-3.4-2.3.6a8 8 0 0 0-1.7-1L15 3h-4l-.5 2.9a8 8 0 0 0-1.7 1L6.5 6.4l-2 3.4L6.5 11a7.7 7.7 0 0 0 .1 2l-2 1.2 2 3.4 2.3-.6a8 8 0 0 0 1.7 1L11 21h4l.5-2.9a8 8 0 0 0 1.7-1l2.3.6 2-3.4-2-1.3z"/></svg>
          </button>
        </div>
      </div>
    </header>
    <main class="sheet">
      <button class="banner" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#124ac6" stroke-width="1.7"><rect x="3" y="10" width="18" height="11" rx="1.6"/><path d="M2.5 10h19M12 10v11"/><path d="M12 10c-1.2-2.4-3.2-4.2-5-3.2-1.4.8-.6 2.6 1.2 3.2"/><path d="M12 10c1.2-2.4 3.2-4.2 5-3.2 1.4.8.6 2.6-1.2 3.2"/></svg>
        <span>Want 50 more credits?<small>G2: 30 · Product Hunt: 20</small></span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <div class="body">
        <div class="grid">
          <article class="tile has-tag">
            <img class="ico" src="../assets/images/mobile/ai_findleads.png" alt="">
            <b>AI Find Leads</b>
            <span class="tag">Leads &amp; contacts</span>
          </article>
          <article class="tile has-tag">
            <img class="ico" src="../assets/images/mobile/scan_card.png" alt="">
            <b>Scan Card</b>
            <span class="tag">Powered by AI</span>
          </article>
          <article class="tile">
            <img class="ico" src="../assets/images/mobile/recently_added.png" alt="">
            <b>Add Company</b>
          </article>
          <article class="tile unread has-tag">
            <span class="badge">37</span>
            <img class="ico" src="../assets/images/mobile/icon_routes.png" alt="">
            <b>Routes</b>
            <em>New route ready</em>
            <span class="tag">Powered by AI</span>
          </article>
          <article class="tile unread">
            <span class="badge">30</span>
            <img class="ico" src="../assets/images/mobile/Supply3.png" alt="">
            <b>Lists</b>
            <em>New list ready</em>
          </article>
          <article class="tile">
            <img class="ico" src="../assets/images/mobile/icon_company.png" alt="">
            <b>Address Book</b>
          </article>
        </div>

        <section class="activity">
          <div class="act-head">
            <div>
              <h2>Activity</h2>
              <p>Tue, Sep 22 · 8:15 AM PT</p>
            </div>
            <button class="cal" type="button">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#124ac6" stroke-width="1.7"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>
              Calendar
            </button>
          </div>
          <div class="card">
            <div class="tabs">
              <button type="button" class="on" id="tab-up">Upcoming</button>
              <button type="button" id="tab-re">Recent</button>
            </div>
            <div id="upcoming">
              <p class="empty">No upcoming activities yet.</p>
            </div>
            <div id="recent" hidden>
              <div class="row">
                <div class="bubble" aria-hidden="true">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#124ac6" stroke-width="1.7"><circle cx="12" cy="8" r="3"/><path d="M5 19c1.2-3 3.4-4.5 7-4.5S17.8 16 19 19"/></svg>
                </div>
                <div class="mid"><strong>1 Contact Added</strong><small>2 hrs ago</small></div>
              </div>
            </div>
          </div>
        </section>
        <div class="ver"><span class="dot"></span> iOS 42.31 (1)</div>
      </div>
    </main>
  </div>
  <script>
    const up = document.getElementById("tab-up");
    const re = document.getElementById("tab-re");
    const upcoming = document.getElementById("upcoming");
    const recent = document.getElementById("recent");
    up.onclick = () => {
      up.classList.add("on");
      re.classList.remove("on");
      upcoming.hidden = false;
      recent.hidden = true;
    };
    re.onclick = () => {
      re.classList.add("on");
      up.classList.remove("on");
      recent.hidden = false;
      upcoming.hidden = true;
    };
  </script>
</body>
</html>
